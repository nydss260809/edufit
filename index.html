    const calculateRealCommute = (originRegion, targetAcademy, mode) => {
      const isDasan = originRegion.includes('다산');
      const isDaechi = targetAcademy.region.includes('대치');
      const isJunggye = targetAcademy.region.includes('중계');
      const isLocalDasan = targetAcademy.region.includes('다산');

      let minutes = 30;
      let distanceKm = 12.5;
      let routeDesc = '';

      if (isDasan && isDaechi) {
        distanceKm = 24.2;
        if (mode === 'transit') {
          minutes = 50;
          routeDesc = '8호선 다산역 ➔ 잠실역 환승 ➔ 3호선/수인분당선 대치·한티역 (약 50분)';
        } else if (mode === 'car') {
          minutes = 38;
          routeDesc = '강변북로 및 올림픽대로 경유 자가용/셔틀 (약 38분)';
        } else {
          minutes = 280;
          routeDesc = '장거리 도보 이동 비권장 (약 4시간 40분)';
        }
      } else if (isDasan && isLocalDasan) {
        distanceKm = 1.8;
        if (mode === 'transit') {
          minutes = 12;
          routeDesc = '시내버스 / 마을버스 (약 12분)';
        } else if (mode === 'car') {
          minutes = 7;
          routeDesc = '자가용 / 라이딩 (약 7분)';
        } else {
          minutes = 18;
          routeDesc = '도보 이동 가능 (약 18분)';
        }
      } else if (isDasan && isJunggye) {
        distanceKm = 14.8;
        if (mode === 'transit') {
          minutes = 42;
          routeDesc = '시내버스 ➔ 경춘선/7호선 중계동 은행사거리 (약 42분)';
        } else if (mode === 'car') {
          minutes = 28;
          routeDesc = '동부간선도로 경유 (약 28분)';
        } else {
          minutes = 180;
          routeDesc = '장거리 도보 이동 비권장';
        }
      } else {
        distanceKm = 8.5;
        minutes = mode === 'transit' ? 35 : mode === 'car' ? 22 : 90;
        routeDesc = `${targetAcademy.region} 방향 이동 (${mode === 'transit' ? '대중교통' : mode === 'car' ? '차량' : '도보'})`;
      }

      return { minutes, distanceKm, routeDesc };
    };

    const callGeminiAPI = async (promptText, systemInstruction, userApiKey) => {
      try {
        const res = await fetch('/api/generate', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ prompt: promptText, systemInstruction })
        });
        if (res.ok) {
          const data = await res.json();
          if (data.text) return data.text;
        }
      } catch (e) {
        console.warn('Backend API endpoint fallback to client-side Gemini request', e);
      }

      const key = userApiKey || localStorage.getItem('GEMINI_API_KEY');
      if (key && key.trim()) {
        try {
          const url = `https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent?key=${key.trim()}`;
          const response = await fetch(url, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
              contents: [
                {
                  role: 'user',
                  parts: [{ text: `${systemInstruction ? systemInstruction + '\n\n' : ''}${promptText}` }]
                }
              ]
            })
          });
          const result = await response.json();
          if (result.candidates && result.candidates[0]?.content?.parts[0]?.text) {
            return result.candidates[0].content.parts[0].text;
          }
        } catch (err) {
          console.error('Direct Gemini Call Error:', err);
        }
      }

      return null;
    };

                            <div className="flex flex-col sm:flex-row lg:flex-col gap-2 shrink-0 lg:w-48">
                              <button
                                onClick={() => setSelectedDetailAcademy(acad)}
                                className="w-full py-2.5 px-4 bg-slate-900 hover:bg-slate-800 dark:bg-gray-800 dark:hover:bg-gray-700 text-white font-bold rounded-xl text-xs transition"
                              >
                                교재 및 리뷰 상세보기
                              </button>
                              
                              <button
                                onClick={() => handleStartConsultation(acad)}
                                className="w-full py-2.5 px-4 bg-blue-600 hover:bg-blue-700 text-white font-bold rounded-xl text-xs transition"
                              >
                                1:1 커리큘럼 AI 문의
                              </button>

                              <button
                                onClick={() => handleOpenReviewModal(acad)}
                                className="w-full py-2.5 px-4 bg-emerald-50 dark:bg-emerald-950/40 text-emerald-700 dark:text-emerald-300 border border-emerald-200 dark:border-emerald-800 font-semibold rounded-xl text-xs hover:bg-emerald-100 transition"
                              >
                                수강 후기 작성하기
                              </button>
                            </div>
                          </div>
                        </div>
                      ))}
                    </div>
                  )}

                  {activeTab === 'map' && (
                    <div className="bg-white dark:bg-gray-900 rounded-2xl border border-slate-200 dark:border-gray-800 p-4 shadow-xs">
                      <div className="mb-3 flex items-center justify-between">
                        <h3 className="font-bold text-slate-900 dark:text-white text-sm">
                          거주지({residentialRegion}) 중심 대치/다산 학원가 위치 지도
                        </h3>
                        <span className="text-xs text-slate-500">Leaflet OpenStreetMap 연동</span>
                      </div>
                      <div ref={mapContainerRef} className="w-full h-[480px] rounded-xl border border-slate-200 dark:border-gray-700"></div>
                    </div>
                  )}

                  <div className="pt-4 flex justify-start">
                    <button
                      onClick={() => setCurrentStep(2)}
                      className="px-6 py-2.5 border border-slate-300 dark:border-gray-700 text-slate-700 dark:text-gray-300 font-semibold rounded-xl hover:bg-slate-100 dark:hover:bg-gray-800 transition text-sm"
                    >
                      ← 진단 조건 다시 수정하기
                    </button>
                  </div>

                </div>
              )}

            </main>

            {}
            {selectedDetailAcademy && (
              <div className="fixed inset-0 z-50 bg-black/60 backdrop-blur-xs flex items-center justify-center p-4">
                <div className="bg-white dark:bg-gray-900 rounded-2xl max-w-2xl w-full max-h-[90vh] overflow-y-auto p-6 shadow-2xl border border-slate-200 dark:border-gray-800 custom-scrollbar">
                  <div className="flex items-start justify-between border-b border-slate-200 dark:border-gray-800 pb-4 mb-4">
                    <div>
                      <span className="text-xs font-bold text-blue-600 dark:text-blue-400">{selectedDetailAcademy.subjectGroup} 학원</span>
                      <h3 className="text-xl font-bold text-slate-900 dark:text-white">{selectedDetailAcademy.academyName}</h3>
                      <p className="text-xs text-slate-500 dark:text-gray-400 mt-0.5">{selectedDetailAcademy.address}</p>
                    </div>
                    <button
                      onClick={() => setSelectedDetailAcademy(null)}
                      className="text-slate-400 hover:text-slate-600 dark:hover:text-gray-200 p-1"
                    >
                      ✕
                    </button>
                  </div>

                  <div className="space-y-4">
                    <h4 className="font-bold text-slate-900 dark:text-white text-sm flex items-center gap-1.5">
                      <span>📚 대표 교재 및 변형 문제 미리보기</span>
                    </h4>

                    {selectedDetailAcademy.materials.map((mat, i) => (
                      <div key={i} className="p-4 rounded-xl bg-slate-50 dark:bg-gray-800/80 border border-slate-200 dark:border-gray-700 space-y-2">
                        <div className="flex items-center justify-between">
                          <span className="font-bold text-blue-900 dark:text-blue-300 text-sm">{mat.title}</span>
                          <span className="text-xs bg-blue-100 dark:bg-blue-950 text-blue-800 dark:text-blue-200 px-2 py-0.5 rounded font-medium">
                            {mat.level}
                          </span>
                        </div>
                        <p className="text-xs text-slate-600 dark:text-gray-300">{mat.description}</p>
                        
                        {mat.samplePreview && (
                          <div className="mt-3 p-3 bg-white dark:bg-gray-900 rounded-lg border border-slate-200 dark:border-gray-700 text-xs space-y-1.5">
                            <div className="font-semibold text-slate-700 dark:text-gray-200">[{mat.samplePreview.chapter}]</div>
                            <div className="text-slate-900 dark:text-gray-100 font-mono bg-slate-100 dark:bg-gray-800 p-2 rounded">
                              {mat.samplePreview.sampleQuestion}
                            </div>
                            <div className="text-amber-700 dark:text-amber-400 font-medium">{mat.samplePreview.teacherNote}</div>
                          </div>
                        )}
                      </div>
                    ))}

                    <div className="pt-4 border-t border-slate-200 dark:border-gray-800">
                      <div className="flex items-center justify-between mb-3">
                        <h4 className="font-bold text-slate-900 dark:text-white text-sm">
                          검증된 수강생 후기 ({selectedDetailAcademy.reviews.length})
                        </h4>
                        <button
                          onClick={() => {
                            const target = selectedDetailAcademy;
                            setSelectedDetailAcademy(null);
                            handleOpenReviewModal(target);
                          }}
                          className="text-xs text-blue-600 dark:text-blue-400 font-bold underline"
                        >
                          + 후기 쓰기
                        </button>
                      </div>

                      <div className="space-y-3">
                        {selectedDetailAcademy.reviews.map((rev) => (
                          <div key={rev.id} className="p-3.5 rounded-xl border border-slate-200 dark:border-gray-800 bg-white dark:bg-gray-900 text-xs space-y-1">
                            <div className="flex items-center justify-between">
                              <span className="font-bold text-slate-800 dark:text-gray-200">{rev.author}</span>
                              <div className="flex items-center space-x-2">
                                <span className="text-amber-500 font-bold">★ {rev.rating}</span>
                                <span className="text-slate-400 text-[10px]">{rev.date}</span>
                              </div>
                            </div>
                            <span className="inline-block text-[10px] text-blue-600 dark:text-blue-400 bg-blue-50 dark:bg-blue-950 px-1.5 py-0.5 rounded">
                              {rev.sourceTag}
                            </span>
                            <p className="text-slate-700 dark:text-gray-300 mt-1 leading-relaxed">{rev.text}</p>
                          </div>
                        ))}
                      </div>
                    </div>
                  </div>

                  <div className="mt-6 flex justify-end">
                    <button
                      onClick={() => setSelectedDetailAcademy(null)}
                      className="px-5 py-2 bg-slate-200 dark:bg-gray-800 text-slate-800 dark:text-gray-200 text-xs font-bold rounded-xl hover:bg-slate-300 transition"
                    >
                      닫기
                    </button>
                  </div>
                </div>
              </div>
            )}

            {}
            {showReviewModal && reviewAcademyTarget && (
              <div className="fixed inset-0 z-50 bg-black/60 backdrop-blur-xs flex items-center justify-center p-4">
                <div className="bg-white dark:bg-gray-900 rounded-2xl max-w-lg w-full p-6 shadow-2xl border border-slate-200 dark:border-gray-800">
                  <h3 className="text-lg font-bold text-slate-900 dark:text-white mb-1">
                    [{reviewAcademyTarget.academyName}] 수강 후기 작성
                  </h3>
                  <p className="text-xs text-slate-500 mb-4">실제 수강 경험을 바탕으로 후기를 남겨주시면 다른 학생들에게 도움이 됩니다.</p>

                  {reviewSubmitSuccess ? (
                    <div className="p-6 text-center text-emerald-600 dark:text-emerald-400 font-bold">
                      ✓ 수강 후기가 성공적으로 등록되었습니다!
                    </div>
                  ) : (
                    <form onSubmit={handleSubmitReview} className="space-y-4 text-xs">
                      <div className="grid grid-cols-2 gap-3">
                        <div>
                          <label className="block font-semibold mb-1">작성자 닉네임</label>
                          <input
                            type="text"
                            value={newReviewAuthor}
                            onChange={(e) => setNewReviewAuthor(e.target.value)}
                            placeholder="예: 김O진 (고2)"
                            className="w-full p-2.5 rounded-lg border border-slate-300 dark:border-gray-700 bg-white dark:bg-gray-800 text-slate-900 dark:text-white"
                          />
                        </div>
                        <div>
                          <label className="block font-semibold mb-1">평점 선택</label>
                          <select
                            value={newReviewRating}
                            onChange={(e) => setNewReviewRating(e.target.value)}
                            className="w-full p-2.5 rounded-lg border border-slate-300 dark:border-gray-700 bg-white dark:bg-gray-800 text-slate-900 dark:text-white font-bold"
                          >
                            <option value="5">★ 5.0 (매우 만족)</option>
                            <option value="4">★ 4.0 (만족)</option>
                            <option value="3">★ 3.0 (보통)</option>
                            <option value="2">★ 2.0 (아쉬움)</option>
                            <option value="1">★ 1.0 (비추천)</option>
                          </select>
                        </div>
                      </div>

                      <div>
                        <label className="block font-semibold mb-1">소속 학교</label>
                        <input
                          type="text"
                          value={newReviewSchoolTag}
                          onChange={(e) => setNewReviewSchoolTag(e.target.value)}
                          placeholder="학교명 (예: 동화고등학교)"
                          className="w-full p-2.5 rounded-lg border border-slate-300 dark:border-gray-700 bg-white dark:bg-gray-800 text-slate-900 dark:text-white"
                        />
                      </div>

                      <div>
                        <label className="block font-semibold mb-1">상세 후기 내용</label>
                        <textarea
                          rows="4"
                          value={newReviewText}
                          onChange={(e) => setNewReviewText(e.target.value)}
                          placeholder="커리큘럼, 강사 질의응답, 내신/수능 연계율 등에 대해 적어주세요."
                          className="w-full p-2.5 rounded-lg border border-slate-300 dark:border-gray-700 bg-white dark:bg-gray-800 text-slate-900 dark:text-white"
                        ></textarea>
                      </div>

                      <div className="flex justify-end space-x-2 pt-2">
                        <button
                          type="button"
                          onClick={() => setShowReviewModal(false)}
                          className="px-4 py-2 border border-slate-300 rounded-lg text-slate-600 hover:bg-slate-100"
                        >
                          취소
                        </button>
                        <button
                          type="submit"
                          className="px-5 py-2 bg-blue-600 text-white font-bold rounded-lg hover:bg-blue-700"
                        >
                          후기 등록
                        </button>
                      </div>
                    </form>
                  )}
                </div>
              </div>
            )}

            {}
            {showConsultModal && (
              <div className="fixed inset-0 z-50 bg-black/60 backdrop-blur-xs flex items-center justify-center p-4">
                <div className="bg-white dark:bg-gray-900 rounded-2xl max-w-xl w-full h-[600px] flex flex-col shadow-2xl border border-slate-200 dark:border-gray-800">
                  
                  <div className="p-4 border-b border-slate-200 dark:border-gray-800 flex items-center justify-between bg-blue-600 text-white rounded-t-2xl">
                    <div className="flex items-center space-x-2">
                      <div className="w-3 h-3 rounded-full bg-emerald-400 animate-pulse"></div>
                      <h3 className="font-bold text-sm">EduFit 1:1 AI 입시 심층 상담실</h3>
                    </div>
                    <button onClick={() => setShowConsultModal(false)} className="text-white hover:opacity-80">
                      ✕
                    </button>
                  </div>

                  <div className="flex-1 p-4 overflow-y-auto space-y-3 custom-scrollbar bg-slate-50 dark:bg-gray-950">
                    {consultMessages.map((msg, index) => (
                      <div
                        key={index}
                        className={`flex ${msg.role === 'user' ? 'justify-end' : 'justify-start'}`}
                      >
                        <div
                          className={`max-w-[85%] p-3 rounded-2xl text-xs sm:text-sm leading-relaxed whitespace-pre-wrap ${
                            msg.role === 'user'
                              ? 'bg-blue-600 text-white rounded-br-none shadow-xs'
                              : 'bg-white dark:bg-gray-800 text-slate-800 dark:text-gray-100 border border-slate-200 dark:border-gray-700 rounded-bl-none shadow-xs'
                          }`}
                        >
                          {msg.text}
                        </div>
                      </div>
                    ))}
                    {isConsultLoading && (
                      <div className="flex justify-start">
                        <div className="bg-white dark:bg-gray-800 p-3 rounded-2xl text-xs text-slate-500 border border-slate-200 dark:border-gray-700 flex items-center space-x-2">
                          <span className="animate-spin">⏳</span>
                          <span>AI가 맞춤 답변을 작성하고 있습니다...</span>
                        </div>
                      </div>
                    )}
                  </div>

                  <div className="p-3 border-t border-slate-200 dark:border-gray-800 bg-white dark:bg-gray-900 rounded-b-2xl flex items-center space-x-2">
                    <input
                      type="text"
                      value={consultInput}
                      onChange={(e) => setConsultInput(e.target.value)}
                      onKeyDown={(e) => e.key === 'Enter' && handleSendConsultMessage()}
                      placeholder="학원 선택, 내신 공부법, 동선에 대해 물어보세요..."
                      className="flex-1 px-3.5 py-2.5 rounded-xl border border-slate-300 dark:border-gray-700 bg-slate-50 dark:bg-gray-800 text-xs sm:text-sm focus:outline-none focus:ring-2 focus:ring-blue-500"
                    />
                    <button
                      onClick={handleSendConsultMessage}
                      disabled={isConsultLoading}
                      className="px-4 py-2.5 bg-blue-600 hover:bg-blue-700 text-white font-bold text-xs rounded-xl shadow-xs transition"
                    >
                      전송
                    </button>
                  </div>

                </div>
              </div>
            )}

            {}
            {showSettingsModal && (
              <div className="fixed inset-0 z-50 bg-black/60 backdrop-blur-xs flex items-center justify-center p-4">
                <div className="bg-white dark:bg-gray-900 rounded-2xl max-w-md w-full p-6 shadow-2xl border border-slate-200 dark:border-gray-800">
                  <h3 className="text-lg font-bold text-slate-900 dark:text-white mb-2">API 키 설정</h3>
                  <p className="text-xs text-slate-500 dark:text-gray-400 mb-4">
                    NEIS 학교 데이터 연동 및 Gemini AI 맞춤 분석을 위한 Key 설정입니다. (백엔드에 GEMINI_API_KEY가 설정되어 있다면 비워두셔도 작동합니다)
                  </p>

                  <div className="space-y-4 text-xs">
                    <div>
                      <label className="block font-semibold mb-1 text-slate-700 dark:text-gray-300">
                        NEIS 나이스 Open API Key (선택)
                      </label>
                      <input
                        type="password"
                        value={neisApiKey}
                        onChange={(e) => setNeisApiKey(e.target.value)}
                        placeholder="NEIS Open API 키 입력"
                        className="w-full p-2.5 rounded-lg border border-slate-300 dark:border-gray-700 bg-white dark:bg-gray-800 text-slate-900 dark:text-white"
                      />
                    </div>

                    <div>
                      <label className="block font-semibold mb-1 text-slate-700 dark:text-gray-300">
                        Gemini API Key (선택)
                      </label>
                      <input
                        type="password"
                        value={geminiApiKey}
                        onChange={(e) => setGeminiApiKey(e.target.value)}
                        placeholder="클라이언트 개별 사용 시 Gemini API Key"
                        className="w-full p-2.5 rounded-lg border border-slate-300 dark:border-gray-700 bg-white dark:bg-gray-800 text-slate-900 dark:text-white"
                      />
                    </div>

                    {settingsSavedNotice && (
                      <p className="text-emerald-600 font-bold text-center">✓ 설정이 저장되었습니다.</p>
                    )}
                  </div>

                  <div className="mt-6 flex justify-end space-x-2">
                    <button
                      onClick={() => setShowSettingsModal(false)}
                      className="px-4 py-2 border border-slate-300 text-slate-600 dark:text-gray-300 text-xs font-semibold rounded-lg hover:bg-slate-100"
                    >
                      취소
                    </button>
                    <button
                      onClick={handleSaveSettings}
                      className="px-5 py-2 bg-blue-600 text-white text-xs font-bold rounded-lg hover:bg-blue-700"
                    >
                      저장하기
                    </button>
                  </div>
                </div>
              </div>
            )}

            <footer className="mt-auto border-t border-slate-200 dark:border-gray-800 py-6 px-4 text-center text-xs text-slate-500 dark:text-gray-500">
              <p>© 2026 EduFit AI. 고등학생 학원 맞춤 연계 및 데이터 기반 입시 솔루션.</p>
            </footer>

          </div>
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
